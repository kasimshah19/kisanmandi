spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

logging.structured.format.console=logstash
logging.level.root=WARN
logging.level.com.kisanmandi=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
spring.jpa.properties.hibernate.log_slow_query=300

# Actuator & Micrometer
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=kisanmandi-backend
management.metrics.tags.profile=prod

# Sentry
sentry.dsn=${SENTRY_DSN:}
sentry.environment=prod
sentry.release=1.0.0
sentry.send-default-pii=false
sentry.traces-sample-rate=0.0

server.forward-headers-strategy=native

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=900000
app.auth.refresh-ttl-days=14
app.auth.cookie-secure=true
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

mandi.api.key=${MANDI_API_KEY:}
mandi.sync.retention-days=90
mandi.sync.run-on-startup=true
mandi.demo-seed.enabled=false

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
mandi.cron.token=${MANDI_CRON_TOKEN:}

app.mail.provider=${APP_MAIL_PROVIDER:brevo}
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:noreply@kisanmandi.com}
app.mail.from-name=${MAIL_FROM_NAME:KisanMandi}
app.mail.frontend-url=${APP_FRONTEND_URL:https://kisanmandi.vercel.app}
app.mail.log-links=false
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.order-emails-enabled=${APP_MAIL_ORDER_EMAILS_ENABLED:true}
app.auth.require-verified-email=${REQUIRE_VERIFIED_EMAIL:false}

app.payment.enabled=${APP_PAYMENT_ENABLED:false}
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.payments.window-minutes=${APP_PAYMENTS_WINDOW_MINUTES:15}
app.payments.allow-live-keys=${APP_PAYMENTS_ALLOW_LIVE_KEYS:false}
