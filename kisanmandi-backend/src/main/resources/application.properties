spring.application.name=kisanmandi-backend
spring.profiles.active=local
server.port=8080

# ─── Database ───────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/kisanmandi_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ─── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── File Upload Limits ────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ─── JWT (secret MUST be >= 32 chars, set in application-local.properties) ───
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# ─── Admin Seeder (set real values in application-local.properties) ──
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ─── Cloudinary ─────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ─── Mandi API ──────────────────────────────────────────
mandi.api.base-url=https://api.data.gov.in/resource
# verify the correct Resource ID of the "Current Daily Price of Various Commodities from Various Markets (Mandi)" dataset on data.gov.in
mandi.api.resource-id=${MANDI_RESOURCE_ID:9ef84268-d588-465a-a308-a864a43d0070}
mandi.api.key=${MANDI_API_KEY:}
