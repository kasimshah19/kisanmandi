spring.application.name=kisanmandi-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${PORT:8080}
server.compression.enabled=true
server.forward-headers-strategy=native

# ─── Database ───────────────────────────────────────────
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/kisanmandi_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ─── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ─── Flyway Migration ──────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# ─── File Upload Limits ────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ─── JWT & Auth Core (15 min access, 14 days refresh) ───
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=900000
app.auth.refresh-ttl-days=14
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}

# ─── Admin Seeder ──
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# ─── Cloudinary ─────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ─── Mandi API ──────────────────────────────────────────
mandi.api.base-url=https://api.data.gov.in/resource
mandi.api.resource-id=${MANDI_RESOURCE_ID:9ef84268-d588-465a-a308-a864a43d0070}
mandi.api.key=${MANDI_API_KEY:}
mandi.sync.states=Maharashtra
mandi.sync.cron=0 0 8,19 * * *
mandi.sync.zone=Asia/Kolkata
mandi.sync.page-size=500
mandi.sync.max-pages=40
mandi.sync.run-on-startup=true
mandi.sync.retention-days=365
mandi.demo-seed.enabled=false

# ─── CORS ──
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ─── Cron Token ──
mandi.cron.token=${MANDI_CRON_TOKEN:}

# ─── Swagger ──
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# ─── Mail & Frontend URL ───
app.mail.provider=${APP_MAIL_PROVIDER:log}
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:noreply@kisanmandi.com}
app.mail.from-name=${MAIL_FROM_NAME:KisanMandi}
app.mail.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.log-links=${APP_MAIL_LOG_LINKS:false}
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.order-emails-enabled=${APP_MAIL_ORDER_EMAILS_ENABLED:true}
app.auth.require-verified-email=${REQUIRE_VERIFIED_EMAIL:false}

# ─── Payment (Razorpay) ───
app.payment.enabled=${APP_PAYMENT_ENABLED:false}
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# ─── Observability (Logging, Actuator, Metrics, Sentry) ───
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] [%X{userId:-}] %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.kisanmandi=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Actuator & Micrometer
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=kisanmandi-backend
management.metrics.tags.profile=${spring.profiles.active:local}

# Sentry
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${spring.profiles.active:local}
sentry.release=1.0.0
sentry.send-default-pii=false
sentry.traces-sample-rate=0.0
