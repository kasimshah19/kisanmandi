spring.application.name=kisanmandi-backend
spring.profiles.active=local
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/kisanmandi_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# JWT
app.jwt.secret=${JWT_SECRET:change-me}
app.jwt.expiration-ms=86400000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Mandi API
mandi.api.base-url=https://api.data.gov.in/resource
# verify the correct Resource ID of the "Current Daily Price of Various Commodities from Various Markets (Mandi)" dataset on data.gov.in
mandi.api.resource-id=REPLACE_ME
mandi.api.key=${MANDI_API_KEY:}
