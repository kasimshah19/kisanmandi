spring.application.name=kisanmandi-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${PORT:8080}
server.compression.enabled=true
server.forward-headers-strategy=framework

# ─── Database ───────────────────────────────────────────
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/kisanmandi_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ─── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ─── File Upload Limits ────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ─── JWT (secret MUST be >= 32 chars) ───
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# ─── Admin Seeder ──
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# ─── Cloudinary ─────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ─── Mandi API ──────────────────────────────────────────
mandi.api.base-url=https://api.data.gov.in/resource
mandi.api.resource-id=${MANDI_RESOURCE_ID:9ef84268-d588-465a-a308-a864a43d0070}
mandi.api.key=${MANDI_API_KEY:}
mandi.sync.states=Maharashtra
mandi.sync.cron=0 0 8,19 * * *
mandi.sync.zone=Asia/Kolkata
mandi.sync.page-size=500
mandi.sync.max-pages=40
mandi.sync.run-on-startup=true
mandi.sync.retention-days=365
mandi.demo-seed.enabled=false

# ─── CORS ──
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ─── Cron Token ──
mandi.cron.token=${MANDI_CRON_TOKEN:}

# ─── Swagger ──
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
