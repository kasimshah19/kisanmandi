name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Tests (Java 17 / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kisanmandi-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        run: mvn -B test

  frontend:
    name: Frontend Build & Tests (Node 20 / React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kisanmandi-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kisanmandi-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify i18n Translation Parity
        run: npm run i18n:check

      - name: Build Frontend Application
        run: npm run build

      - name: Run Frontend Tests
        run: npm test
